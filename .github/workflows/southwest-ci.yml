name: Southwest Airlines CI Pipeline

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run system health check
        run: |
          echo "=== Southwest CI Pipeline Starting ==="
          date
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"

      - name: Check required files exist
        run: |
          echo "Checking required Southwest files..."
          test -f morning-report.sh && echo "✅ morning-report.sh found" || exit 1
          test -f log-files.sh && echo "✅ morning-report.sh found" || exit 1"
          test -f error-check.sh && echo "✅ error-check.sh found" || exit 1
          echo "All required files present!"

      - name: Check scripts are executable
        run: |
          echo "Checking script permissions..."
          test -x morning-report.sh && echo "✅ morning-report.sh is executable" || exit 1
          test -x error-check.sh && echo "✅ error-check.sh is executable" || exit 1

      - name: Run syntax check
        run: |
          echo "Checking bash syntax..."
          bash -n morning-report.sh && echo "✅ morning-report.sh syntax OK" || exit 1
          bash -n error-check.sh && echo "✅ error-check.sh syntax OK" || exit 1

      - name: Pipeline complete
        run: echo "✅ All checks passed — safe to deploy!"

